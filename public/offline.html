<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4f5c" />
    <title>You are offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6fbfd; color: #0b1b33; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 22rem; margin: 1rem; padding: 2rem; text-align: center; background: #fff; border-radius: 1rem; box-shadow: 0 8px 30px rgb(11 27 51 / 0.08); }
      img { width: 4rem; height: 4rem; border-radius: 1rem; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: rgb(11 27 51 / 0.7); font-size: 0.9rem; line-height: 1.5; }
      button { height: 2.75rem; padding: 0 1.5rem; border: 0; border-radius: 0.5rem; background: #f5a800; color: #0b1b33; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>DOA needs a connection to show your business records safely. Check your internet and try again; nothing you did before has been lost.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
